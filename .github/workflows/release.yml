name: Release

# Pushing a version tag (v1.2.3) tests the tagged commit, builds zpl2png for
# each platform and publishes a GitHub release with the CHANGELOG section for
# that version. Run it by hand to (re)publish a release for an existing tag;
# the builds on an existing release are replaced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, e.g. v0.3.3
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # all tags, to tell whether this is the newest
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::no tag $TAG"; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build
        run: |
          mkdir dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${p%/*} arch=${p#*/}
            name=zpl2png_${TAG}_${os}_${arch}
            ext=; [ "$os" = windows ] && ext=.exe
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' \
              -o "dist/$name/zpl2png$ext" ./cmd/zpl2png
            cp LICENSE README.md "dist/$name/"
            (cd dist && if [ "$os" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi && rm -r "$name")
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Smoke test
        run: |
          tar xzf "dist/zpl2png_${TAG}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          printf '^XA^FO50,50^A0N,40,40^FDHello^FS^BY2^FO50,120^BCN,80^FD12345^FS^XZ' > t.zpl
          "./zpl2png_${TAG}_linux_amd64/zpl2png" t.zpl
          file label-1.png | grep -q 'PNG image data'
      - name: Publish
        run: |
          # The CHANGELOG section for this version, headings demoted one level.
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on' CHANGELOG.md | sed 's/^###/##/' > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for ${TAG#v}; using generated notes."
            notes=(--generate-notes)
          else
            notes=(--notes-file notes.md)
          fi
          # Only the newest version is marked Latest, so republishing an
          # older tag does not displace it. Pre-release tags (v1.0.0-rc.1)
          # are marked as such.
          flags=(--latest=false)
          newest=$(git tag -l 'v*' --sort=-v:refname | awk '!/-/' | head -1)
          [ "$TAG" = "$newest" ] && flags=(--latest)
          case "$TAG" in *-*) flags=(--latest=false --prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}" "${flags[@]}" dist/*
          fi
