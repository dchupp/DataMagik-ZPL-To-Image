name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Decode round-trips
        working-directory: internal/verify
        run: |
          go vet ./...
          go test ./...
      - name: Fuzz (smoke)
        run: go test -run XXX -fuzz FuzzRender -fuzztime 60s .
